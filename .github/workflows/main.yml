name: Automatic Shorts Publisher 24/7

on:
  schedule:
    # ==========================================================
    # INDIA TIME (IST = UTC+5:30)
    #
    # 12:00 PM IST = 06:30 UTC
    # 06:00 PM IST = 12:30 UTC
    # ==========================================================

    - cron: '30 6 * * *'     # 12:00 PM IST
    - cron: '30 12 * * *'    # 06:00 PM IST

  # Manual run from GitHub Actions
  workflow_dispatch:

jobs:
  build_and_upload:

    runs-on: ubuntu-latest

    # Give enough time for:
    # AI script generation
    # Pexels video downloads
    # Voice generation
    # Video rendering
    # YouTube upload
    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout Code

        uses: actions/checkout@v4

        with:
          persist-credentials: true


      # ========================================================
      # 2. SETUP PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.10'


      # ========================================================
      # 3. SYSTEM DEPENDENCIES
      # ========================================================

      - name: Install System Dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            xvfb

          # Allow ImageMagick operations used by video rendering
          sudo sed -i \
            's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@\*"/g' \
            /etc/ImageMagick-6/policy.xml


      # ========================================================
      # 4. INSTALL PYTHON PACKAGES
      # ========================================================

      - name: Install Python Packages

        run: |

          python -m pip install --upgrade pip

          pip install \
            groq \
            requests \
            python-dotenv \
            edge-tts \
            moviepy \
            pillow \
            numpy \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2


      # ========================================================
      # 5. RUN VIDEO GENERATOR + YOUTUBE UPLOADER
      # ========================================================

      - name: Generate and Upload Short

        env:

          # Groq AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # Pexels stock video API
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          echo "=============================================="
          echo "🚀 AUTOMATIC YOUTUBE SHORTS SYSTEM"
          echo "=============================================="

          echo "🇮🇳 Timezone: Asia/Kolkata"
          echo "🎬 Generating mystery short..."
          echo "🎙️ Generating Hindi male voice..."
          echo "🎥 Downloading Pexels footage..."
          echo "🎞️ Rendering video..."
          echo "📤 Uploading to YouTube..."

          python yt_animation_test.py


      # ========================================================
      # 6. SAVE HISTORY + YOUTUBE TOKEN
      # ========================================================

      - name: Save History to Repository

        if: always()

        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.txt token.json || true

          git diff --cached --quiet || \
            git commit -m "Auto-update history and YouTube token [skip ci]"

          git push || true


      # ========================================================
      # 7. FINISH
      # ========================================================

      - name: Job Complete

        if: always()

        run: |

          echo "=============================================="
          echo "✅ AUTOMATION JOB FINISHED"
          echo "=============================================="

          echo "📅 Schedule:"
          echo "   12:00 PM IST"
          echo "   06:00 PM IST"

          echo "🎬 Next automatic run will be according to schedule."
