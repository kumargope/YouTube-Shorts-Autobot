name: Automatic Shorts Publisher 24/7

on:
  schedule:
    # IST (Indian Standard Time) के हिसाब से शेड्यूल:
    # 1. सुबह 03:00 AM IST (भोर में) = 21:30 PM UTC (Previous Day)
    # 2. दोपहर/शाम 03:00 PM IST = 09:30 AM UTC
    - cron: '30 21 * * *'  # Runs every day at 03:00 AM IST
    - cron: '30 9 * * *'   # Runs every day at 03:00 PM IST
  
  workflow_dispatch: # मैन्युअल रूप से चलाने का बटन

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick xvfb
          sudo sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install groq requests python-dotenv edge-tts moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Auto Uploader
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Save History to Repo
        if: always()
        run: |
          git config --global user.name 'YouTube Autobot'
          git config --global user.email 'autobot@users.noreply.github.com'
          git add used_topics.txt token.json || true
          git commit -m "Auto-update history and token [skip ci]" || true
          git push
