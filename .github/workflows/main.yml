name: Automatic Shorts Publisher 24/7

on:
  schedule:
    # IST: Morning 03:00 AM & Afternoon 03:00 PM
    - cron: '30 21 * * *'  # 03:00 AM IST
    - cron: '30 9 * * *'   # 03:00 PM IST
  
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # Git Push के लिए आवश्यक राइट परमिशन

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick xvfb
          sudo sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install groq requests python-dotenv edge-tts moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Auto Uploader
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Save History to Repo
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add used_topics.txt token.json || true
          git commit -m "Auto-update history and token [skip ci]" || true
          git push
